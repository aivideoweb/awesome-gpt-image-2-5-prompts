name: Content checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_catalog.py
      - run: python3 scripts/build_gallery.py
      - run: python3 scripts/validate.py
      - run: git diff --exit-code
      - run: git diff --check
